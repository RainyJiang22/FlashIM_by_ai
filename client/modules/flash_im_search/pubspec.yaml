name: flash_im_search
description: "Flash IM comprehensive and conversation message search package."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.5
  flutter: ">=1.17.0"

dependencies:
  dio: ^5.9.0
  equatable: ^2.0.7
  flash_im_chat:
    path: ../flash_im_chat
  flash_im_conversation:
    path: ../flash_im_conversation
  flash_im_friend:
    path: ../flash_im_friend
  flash_shared:
    path: ../flash_shared
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.3

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
