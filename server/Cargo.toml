[workspace]
members = [
    ".",
    "modules/flash_core",
    "modules/flash_auth",
    "modules/flash_user",
    "modules/im-ws",
    "modules/im-conversation",
    "modules/im-message",
    "modules/im-friend",
    "modules/im-group",
    "modules/app-storage",
]
resolver = "2"

[package]
name = "falsh-im"
version = "0.3.0"
edition = "2024"

[dependencies]
app-storage = { path = "modules/app-storage" }
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.42", features = ["serde"] }
flash_auth = { path = "modules/flash_auth" }
flash_core = { path = "modules/flash_core" }
flash_user = { path = "modules/flash_user" }
futures-util = "0.3.31"
im-conversation = { path = "modules/im-conversation" }
im-friend = { path = "modules/im-friend" }
im-group = { path = "modules/im-group" }
im-message = { path = "modules/im-message" }
im-ws = { path = "modules/im-ws" }
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
local-ip-address = "0.6.13"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "chrono", "json"] }
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.6", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.2", features = ["util"] }
